<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign In — WatchFlix</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f0fdf8;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--brand:#059669;--brand2:#10b981}
body.theme-dark{--bg:#0b1220;--card:#111827;--text:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--soft:#1e293b}
body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 480px at 12% -8%,rgba(16,185,129,.18),transparent 55%),radial-gradient(700px 400px at 100% 0%,rgba(5,150,105,.1),transparent 50%),var(--bg)}
.shell{max-width:430px;margin:0 auto;min-height:100vh;padding:28px 18px 40px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo-mark{width:40px;height:40px;border-radius:12px;flex-shrink:0;background:conic-gradient(from 210deg,#047857,#34d399,#a7f3d0,#059669);padding:2px;box-shadow:0 8px 20px rgba(5,150,105,.25)}
.logo-mark-inner{width:100%;height:100%;border-radius:10px;background:#fff;display:grid;place-items:center}
body.theme-dark .logo-mark-inner{background:#0b1220}
.logo-mark-inner span{font-weight:900;font-size:17px;background:linear-gradient(135deg,#34d399,#059669);-webkit-background-clip:text;color:transparent}
.brand-text .name{font-weight:900;font-size:14px;letter-spacing:.08em}
.brand-text .tag{font-size:9px;color:var(--muted);letter-spacing:.12em;font-weight:700;margin-top:2px}
.theme-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:0 20px 50px -28px rgba(15,23,42,.12)}
h1{margin:0 0 6px;font-size:24px;font-weight:900;letter-spacing:-.02em}
.sub{margin:0 0 22px;font-size:13px;color:var(--muted);line-height:1.45}
label{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:0 0 6px;text-transform:uppercase}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:14px;font-weight:600;background:var(--soft);color:var(--text);outline:none;margin-bottom:14px;font-family:inherit}
.field:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#047857,#10b981);color:#fff;box-shadow:0 12px 28px rgba(5,150,105,.28);margin-top:4px;font-family:inherit}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.4}
.msg.err{display:block;background:rgba(239,68,68,.1);color:#b91c1c;border:1px solid rgba(239,68,68,.25)}
.msg.ok{display:block;background:rgba(16,185,129,.1);color:#047857;border:1px solid rgba(16,185,129,.25)}
body.theme-dark .msg.err{color:#fecaca}body.theme-dark .msg.ok{color:#6ee7b7}
.foot{text-align:center;margin-top:22px;font-size:13px;color:var(--muted)}
.foot a{color:var(--brand);font-weight:800;text-decoration:none}
.back{display:inline-block;margin-top:auto;padding-top:28px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none}
.session-note{display:none;margin-bottom:14px;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:600;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:var(--muted);line-height:1.4}
.session-note.show{display:block}.session-note a{color:var(--brand);font-weight:800}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <a class="brand" href="index.html">
      <div class="logo-mark"><div class="logo-mark-inner"><span>W</span></div></div>
      <div class="brand-text"><div class="name">WATCHFLIX</div><div class="tag">WATCH · FINISH · COLLECT</div></div>
    </a>
    <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Theme">☾</button>
  </div>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your WatchFlix account. Fill in your details, then tap Sign in.</p>
    <div class="session-note" id="sessionNote">You already have a session on this device. <a href="dashboard.html/">Open dashboard</a> or sign in again below.</div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <label for="email">Email or username</label>
      <input class="field" id="email" name="email" autocomplete="username" required placeholder="you@email.com">
      <label for="password">Password</label>
      <input class="field" id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      <button class="btn" type="submit" id="loginBtn">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <div class="foot">New here? <a href="register">Create a free account</a></div>
  <a class="back" href="index.html">← Back to home</a>
</div>
<script>
const API_URL="https://global-api-platform-production.up.railway.app";
const API_KEY="ece6dd20e145735a9fa1f93203d561a1c362ae5fb1e64ac136df0b8081d3264c";
const LS={token:"wf_token",user:"wf_user",theme:"wf_theme",device:"wf_device_id"};
(function(){let t="light";try{t=localStorage.getItem(LS.theme)||"light"}catch(e){}document.body.classList.toggle("theme-dark",t==="dark");const b=document.getElementById("themeBtn");if(b)b.textContent=t==="dark"?"☀":"☾"})();
function toggleTheme(){const dark=!document.body.classList.contains("theme-dark");document.body.classList.toggle("theme-dark",dark);try{localStorage.setItem(LS.theme,dark?"dark":"light")}catch(e){}const b=document.getElementById("themeBtn");if(b)b.textContent=dark?"☀":"☾"}
if(localStorage.getItem(LS.token)){const n=document.getElementById("sessionNote");if(n)n.classList.add("show")}
function getDeviceId(){try{let id=localStorage.getItem(LS.device);if(!id){id="d_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,12);localStorage.setItem(LS.device,id)}return id}catch(e){return "d_unknown"}}
function devicePayload(){return{deviceId:getDeviceId(),userAgent:navigator.userAgent||"",language:navigator.language||"",platform:navigator.platform||"",screen:(screen.width||0)+"x"+(screen.height||0),timezone:(Intl.DateTimeFormat().resolvedOptions().timeZone||""),touch:navigator.maxTouchPoints||0}}
function showMsg(text,ok){const m=document.getElementById("msg");m.className="msg "+(ok?"ok":"err");m.textContent=text}
async function doLogin(e){
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const btn=document.getElementById("loginBtn");
  btn.disabled=true;btn.textContent="Signing in…";
  document.getElementById("msg").style.display="none";
  const device=devicePayload();
  try{
    const bodyBase={email,username:email,password,...device,deviceFingerprint:device.deviceId};
    const paths=["/api/auth/login","/api/v1/auth/login","/api/v1/login"];
    let data=null,lastErr="Login failed";
    for(const path of paths){
      try{
        const res=await fetch(API_URL+path,{method:"POST",headers:{"Content-Type":"application/json","X-API-Key":API_KEY},body:JSON.stringify(bodyBase)});
        const body=await res.json().catch(()=>({}));
        if(res.ok&&body.success!==false){data=body;break}
        lastErr=body.message||body.error||("HTTP "+res.status);
      }catch(err){lastErr=err.message||lastErr}
    }
    if(!data)throw new Error(lastErr);
    const token=data.token||data.accessToken||data.data&&data.data.token||data.data&&data.data.accessToken;
    const user=data.user||data.data&&data.data.user||data.data||null;
    if(!token)throw new Error("No token returned");
    localStorage.setItem(LS.token,token);
    if(user)localStorage.setItem(LS.user,JSON.stringify(user));
    showMsg("Signed in successfully. Opening dashboard…",true);
    setTimeout(function(){location.href="dashboard.html"},900);
  }catch(err){
    showMsg(err.message||"Could not sign in",false);
    btn.disabled=false;btn.textContent="Sign in";
  }
  return false;
}
</script>
  
<!-- Adsterra Social Bar -->
<script src="https://guyprior.com/d5/31/00/d53100897c448dc3ffb3cfde0e31918f.js"></script>
  
</body>
</html>
