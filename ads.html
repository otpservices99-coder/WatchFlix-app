    "use strict";


    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const API_URL =
      "https://global-api-platform-production.up.railway.app";


    const API_KEY =
      "ece6dd20e145735a9fa1f93203d561a1c362ae5fb1e64ac136df0b8081d3264c";


    const DISPLAY_AD_PLATFORM =
      "display_ads";


    const RETURN_URL =
      "https://watchflix-app.pages.dev/watchflixads/";


    /* =========================================================
       STATE
       ========================================================= */

    let timerNeed = 30;

    let timerEnd = 0;

    let timerId = null;


    /* =========================================================
       HELPERS
       ========================================================= */

    function getToken() {

      try {

        return (
          localStorage.getItem("wf_token") ||
          localStorage.getItem("token") ||
          ""
        );

      } catch (error) {

        return "";

      }

    }


    function getAuthHeaders() {

      const headers = {
        "X-API-Key": API_KEY
      };


      const token =
        getToken();


      if (token) {

        headers.Authorization =
          "Bearer " + token;

      }


      return headers;

    }


    function getElement(id) {

      return document.getElementById(id);

    }


    function escapeHtml(value) {

      return String(
        value == null ? "" : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function normalizeUrl(url) {

      if (!url) {

        return "";

      }


      let value =
        String(url)
          .trim()
          .replace(
            /\s+/g,
            ""
          );


      if (
        !/^https?:\/\//i.test(value)
      ) {

        value =
          "https://" + value;

      }


      return value;

    }


    function isValidUrl(url) {

      try {

        const parsed =
          new URL(url);


        return (
          parsed.protocol === "http:" ||
          parsed.protocol === "https:"
        );

      } catch (error) {

        return false;

      }

    }


    function isDisplayAd(task) {

      if (!task) {

        return false;

      }


      const platform =
        String(
          task.platform || ""
        ).toLowerCase();


      const metadata =
        task.metadata ||
        task.meta ||
        {};


      const kind =
        String(
          metadata.kind || ""
        ).toLowerCase();


      return (
        platform === DISPLAY_AD_PLATFORM ||
        platform === "display" ||
        kind === DISPLAY_AD_PLATFORM ||
        metadata.displayAd === true
      );

    }


    /* =========================================================
       TIMER
       
       The timer is completely independent of
       AntiAdBlock Core.
       ========================================================= */

    function stopTimer() {

      if (timerId) {

        clearInterval(
          timerId
        );

        timerId =
          null;

      }

    }


    function startTimer(seconds) {

      timerNeed =
        Math.max(
          5,
          Number(seconds) || 30
        );


      timerEnd =
        Date.now() +
        timerNeed * 1000;


      stopTimer();


      const bar =
        getElement("timerBar");


      if (bar) {

        bar.classList.remove(
          "paused"
        );

      }


      const hint =
        getElement("timerHint");


      if (hint) {

        hint.textContent =
          "Returning when timer ends";

      }


      tickTimer();


      timerId =
        setInterval(
          tickTimer,
          200
        );

    }


    function tickTimer() {

      const remaining =
        Math.max(
          0,
          (
            timerEnd -
            Date.now()
          ) / 1000
        );


      const clock =
        getElement("clock");


      const fill =
        getElement("timerFill");


      const hint =
        getElement("timerHint");


      const minutes =
        Math.floor(
          remaining / 60
        );


      const seconds =
        Math.ceil(
          remaining % 60
        );


      if (clock) {

        clock.textContent =
          String(minutes)
            .padStart(2, "0") +
          ":" +
          String(seconds)
            .padStart(2, "0");

      }


      if (fill) {

        const progress =
          (
            (
              timerNeed -
              remaining
            ) /
            timerNeed
          ) * 100;


        fill.style.width =
          Math.min(
            100,
            Math.max(
              0,
              progress
            )
          ) + "%";

      }


      if (hint) {

        hint.textContent =
          remaining > 0
            ? "Returning when timer ends"
            : "Returning…";

      }


      if (
        remaining <= 0
      ) {

        stopTimer();


        setTimeout(
          goBack,
          400
        );

      }

    }


    /* =========================================================
       RETURN TO WATCHFLIX
       ========================================================= */

    function goBack() {

      try {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const id =
          params.get("id");


        if (id) {

          window.location.href =
            RETURN_URL +
            "?id=" +
            encodeURIComponent(id);

        } else {

          window.location.href =
            RETURN_URL;

        }

      } catch (error) {

        window.location.href =
          RETURN_URL;

      }

    }


    /* =========================================================
       TIMER CONFIGURATION
       ========================================================= */

    function resolveTimerSec(offers) {

      let maximum =
        0;


      (offers || []).forEach(
        function (task) {

          const metadata =
            task.metadata ||
            task.meta ||
            {};


          const seconds =
            Number(
              metadata.timerSec ||
              metadata.durationSec ||
              0
            );


          if (
            seconds > maximum
          ) {

            maximum =
              seconds;

          }

        }
      );


      if (
        maximum >= 5
      ) {

        return maximum;

      }


      try {

        const stored =
          Number(
            localStorage.getItem(
              "wf_da_global_timer"
            ) || 0
          );


        if (
          stored >= 5
        ) {

          return stored;

        }

      } catch (error) {}


      try {

        const querySeconds =
          Number(
            new URLSearchParams(
              window.location.search
            ).get("t") || 0
          );


        if (
          querySeconds >= 5
        ) {

          return querySeconds;

        }

      } catch (error) {}


      return 30;

    }


    /* =========================================================
       LOAD OFFERS
       ========================================================= */

    async function loadOffers() {

      const list =
        getElement("list");


      if (!list) {

        return 30;

      }


      let offers =
        [];


      try {

        if (
          getToken()
        ) {

          const response =
            await fetch(
              API_URL +
              "/api/v1/sponsored-tasks",
              {
                method:
                  "GET",

                headers:
                  getAuthHeaders()
              }
            );


          const body =
            await response
              .json()
              .catch(
                function () {

                  return {};

                }
              );


          if (
            response.ok &&
            body.success !== false
          ) {

            const rows =
              Array.isArray(
                body.data
              )
                ? body.data
                : [];


            offers =
              rows.filter(
                function (task) {

                  return (
                    task &&
                    task.active !== false &&
                    isDisplayAd(task)
                  );

                }
              );

          }

        }

      } catch (error) {

        console.warn(
          "[WatchFlix] Offers request failed:",
          error
        );

      }


      if (
        !offers.length
      ) {

        list.innerHTML =
          "";

      } else {

        list.innerHTML =
          offers
            .map(
              function (task) {

                const title =
                  task.title ||
                  "Offer";


                const description =
                  String(
                    task.description ||
                    ""
                  )
                    .replace(
                      /<!--WFJSON:[\s\S]*?-->/g,
                      ""
                    )
                    .trim();


                const image =
                  normalizeUrl(
                    task.imageUrl ||
                    task.image ||
                    ""
                  );


                const target =
                  normalizeUrl(
                    task.targetUrl ||
                    task.url ||
                    ""
                  );


                const validTarget =
                  isValidUrl(
                    target
                  );


                let html =
                  '<article class="card">';


                html +=
                  '<div class="cover">';


                if (
                  image
                ) {

                  html +=
                    '<img src="' +
                    escapeHtml(
                      image
                    ) +
                    '" alt="" loading="lazy">';

                }


                html +=
                  "</div>";


                html +=
                  '<div class="body">';


                html +=
                  "<h2>" +
                  escapeHtml(
                    title
                  ) +
                  "</h2>";


                if (
                  description
                ) {

                  html +=
                    "<p>" +
                    escapeHtml(
                      description.slice(
                        0,
                        220
                      )
                    ) +
                    "</p>";

                }


                if (
                  validTarget
                ) {

                  html +=
                    '<a class="cta" href="' +
                    escapeHtml(
                      target
                    ) +
                    '" target="_blank" rel="noopener noreferrer">' +
                    "Open if interested" +
                    "</a>";

                }


                html +=
                  "</div>";


                html +=
                  "</article>";


                return html;

              }
            )
            .join("");

      }


      return resolveTimerSec(
        offers
      );

    }


    /* =========================================================
       APPLICATION BOOT
       
       IMPORTANT:
       There is NO ad-block detection here.
       AntiAdBlock Core is completely independent.
       ========================================================= */

    async function boot() {

      console.log(
        "[WatchFlix] Page boot started"
      );


      try {

        const seconds =
          await loadOffers();


        startTimer(
          seconds
        );


        console.log(
          "[WatchFlix] Page initialized successfully"
        );


      } catch (error) {

        console.error(
          "[WatchFlix] Application error:",
          error
        );


        /*
         * Keep the page functional even if
         * the offers API fails.
         */

        startTimer(
          30
        );

      }

    }


    /* =========================================================
       START APPLICATION
       ========================================================= */

    if (
      document.readyState === "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        boot,
        {
          once: true
        }
      );

    } else {

      boot();

    }

  </script>  <!-- =========================================================
