<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#070b16;color:#e2e8f0}
.shell{max-width:430px;margin:0 auto;min-height:100vh;padding:0 0 calc(28px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top,0)) 16px 12px;border-bottom:1px solid #1e293b;background:#0b1220;position:sticky;top:0;z-index:10}
.top a{color:#94a3b8;text-decoration:none;font-size:13px;font-weight:700}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#10b981,#059669);display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff}
.name{font-weight:800;font-size:14px}
.main{flex:1;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;text-align:center}
.lead{margin:0;font-size:13px;line-height:1.55;color:#94a3b8;text-align:center}
/* Network banner mount — must exist for the ad unit */
.ad-slot{
  width:100%;
  min-height:120px;
  border-radius:14px;
  background:#0f172a;
  border:1px solid #1e293b;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ad-slot > div{width:100%}
.ad-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#475569;text-align:center;margin-bottom:6px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.btn{
  display:flex;align-items:center;justify-content:center;
  min-height:48px;padding:14px 18px;border-radius:14px;border:0;font-weight:800;font-size:14px;
  background:linear-gradient(135deg,#10b981,#059669);color:#fff;text-decoration:none;
  box-shadow:0 12px 28px rgba(16,185,129,.25)
}
.btn.secondary{background:#1e293b;color:#e2e8f0;box-shadow:none;border:1px solid #334155}
.foot{padding:14px 20px;font-size:11px;color:#475569;text-align:center;line-height:1.45}
</style>
