<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#070b16;color:#f1f5f9}
.shell{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e293b;background:#0b1220;position:sticky;top:0;z-index:20}
.topbar a{color:#94a3b8;text-decoration:none;font-size:13px;font-weight:700}
.topbar .t{font-weight:800;font-size:14px}
.progress{height:4px;background:#1e293b;width:100%}
.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#3b82f6);transition:width .1s linear}
.warn{margin:12px 16px;padding:12px 14px;border-radius:14px;border:1px solid rgba(239,68,68,.45);background:rgba(239,68,68,.12);color:#fecaca;font-size:12px;font-weight:600;line-height:1.5}
.warn b{color:#fff}
.visual{height:min(42vh,260px);background:radial-gradient(circle at 50% 40%,#0f766e,#020617 70%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual img{width:100%;height:100%;object-fit:cover}
.visual .ph{text-align:center;padding:24px;color:#94a3b8;font-weight:700;font-size:14px}
.dots{display:flex;gap:8px;justify-content:center;padding:14px 0 6px;flex-wrap:wrap}
.dots span{width:8px;height:8px;border-radius:50%;background:#334155}
.dots span.on{background:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.3)}
.dots span.done{background:#10b981}
.body{padding:8px 20px 0}
.body h1{margin:0 0 8px;font-size:20px;font-weight:800}
.body p{margin:0;font-size:14px;color:#94a3b8;line-height:1.55}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;font-weight:700;color:#64748b}
.clicks{display:flex;gap:8px;justify-content:center;padding:16px;flex-wrap:wrap}
.clicks i{width:30px;height:30px;border-radius:50%;border:2px solid #334155;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#64748b}
.clicks i.ok{border-color:#10b981;background:rgba(16,185,129,.2);color:#34d399}
.clicks i.lock{border-color:#475569;opacity:.55}
.cta{margin:0 20px;width:calc(100% - 40px);border:0;border-radius:16px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;background:#38bdf8;color:#0f172a;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 32px rgba(56,189,248,.35)}
.cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.cta.done{background:#10b981;color:#fff}
.cta.complete{background:linear-gradient(135deg,#059669,#10b981);color:#fff;margin-top:10px}
.cta.locked{background:#334155;color:#94a3b8}
.foot{padding:14px 20px;font-size:12px;color:#64748b;text-align:center;line-height:1.45}
.msg{margin:8px 20px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;display:none}
.msg.ok{display:block;background:rgba(16,185,129,.12);color:#34d399}
.msg.err{display:block;background:rgba(248,113,113,.12);color:#f87171}
.msg.info{display:block;background:rgba(59,130,246,.12);color:#60a5fa}
.status-banner{margin:12px 16px;padding:14px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.45;display:none}
.status-banner.pending{display:block;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fbbf24}
.status-banner.approved{display:block;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#34d399}
.status-banner.rejected{display:block;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#f87171}
</style>

<script>
const API_URL = "https://global-api-platform-production.up.railway.app";
const API_KEY = "ece6dd20e145735a9fa1f93203d561a1c362ae5fb1e64ac136df0b8081d3264c";

function token(){ return localStorage.getItem("wf_token") || localStorage.getItem("token") || ""; }
function uid(){
  try{
    const u = JSON.parse(localStorage.getItem("wf_user") || localStorage.getItem("user") || "null");
    return String((u && (u._id || u.id)) || "");
  }catch(e){ return ""; }
}
function uname(){
  try{
    const u = JSON.parse(localStorage.getItem("wf_user") || localStorage.getItem("user") || "null");
    return (u && (u.username || u.email || u.name)) || "user";
  }catch(e){ return "user"; }
}
function $(id){ return document.getElementById(id); }
function qs(name){ return new URLSearchParams(location.search).get(name); }
function sid(){ return "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function completionsKey(){ return "wf_ads_completions_" + (uid() || "guest") + "_" + todayKey(); }
function getCompletionsToday(){
  try{ return JSON.parse(localStorage.getItem(completionsKey()) || "[]"); }catch(e){ return []; }
}
function stageProgressKey(taskId){
  return "wf_ads_stage_prog_" + (uid() || "guest") + "_" + String(taskId);
}
function loadStageProgress(taskId){
  try{
    const p = JSON.parse(localStorage.getItem(stageProgressKey(taskId)) || "null");
    if(p && Array.isArray(p.clicked)) return p;
  }catch(e){}
  return null;
}
function saveStageProgress(taskId, clicked, index){
  try{
    localStorage.setItem(stageProgressKey(taskId), JSON.stringify({
      clicked: clicked.slice(),
      index: index,
      updatedAt: new Date().toISOString()
    }));
  }catch(e){}
}
function clearStageProgress(taskId){
  try{ localStorage.removeItem(stageProgressKey(taskId)); }catch(e){}
}
function authHeaders(json){
  const h = { "X-API-Key": API_KEY };
  const t = token();
  if(t) h["Authorization"] = "Bearer " + t;
  if(json) h["Content-Type"] = "application/json";
  return h;
}

function encodeWfPackConfig(cfg){
  try{ return "<!--WFJSON:" + JSON.stringify(cfg) + "-->"; }catch(e){ return ""; }
}
function decodeWfPackConfig(text){
  if(!text) return null;
  const m = String(text).match(/<!--WFJSON:([\s\S]*?)-->/);
  if(!m) return null;
  try{ return JSON.parse(m[1]); }catch(e){ return null; }
}
function stripWfPackConfig(text){
  return String(text || "").replace(/<!--WFJSON:[\s\S]*?-->/g, "").trim();
}

function normalizeUrl(url){
  if(!url) return "";
  url = String(url).trim().replace(/\s+/g, "");
  if(!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url) && !/^tel:/i.test(url)) url = "https://" + url;
  return url;
}
function isValidUrl(url){
  try{ new URL(url); return true; }catch{ return false; }
}
function showMsg(text, type){
  const m = $("msg");
  if(!m) return;
  m.className = "msg " + (type || "info");
  m.textContent = text;
}

function mapTaskToCampaign(task){
  if(!task || typeof task !== "object") return null;
  const id = String(task._id || task.id || "");
  if(!id) return null;
  const meta = Object.assign({}, task.metadata || task.meta || {});
  const embedded = decodeWfPackConfig(task.description);
  if(embedded && typeof embedded === "object") Object.assign(meta, embedded);

  let slots = task.slots || meta.slots || task.stages || meta.stages || task.offers || meta.offers || null;
  if(!Array.isArray(slots) || !slots.length){
    const url = task.targetUrl || task.url || task.link || task.offerUrl || meta.url || "";
    slots = [{
      title: task.title || "Stage 1",
      description: stripWfPackConfig(task.description || task.instructions || "Open the partner link, then wait for the timer."),
      url: url,
      imageUrl: task.imageUrl || task.image || task.bannerUrl || meta.imageUrl || "",
      cta: task.cta || task.ctaLabel || meta.cta || "Go!"
    }];
  } else {
    slots = slots.map((s, i) => ({
      title: s.title || s.name || ("Stage " + (i + 1)),
      description: s.description || s.desc || s.instructions || "",
      url: s.url || s.link || s.targetUrl || s.href || "",
      imageUrl: s.imageUrl || s.image || s.bannerUrl || "",
      cta: s.cta || s.ctaLabel || "Go!"
    }));
  }
  const rewardRaw = Number(meta.rewardWcoin ?? task.rewardWcoin ?? task.rewardAmount ?? task.reward ?? 0);
  let rewardWcoin = rewardRaw;
  if(meta.rewardWcoin == null && task.rewardWcoin == null && rewardRaw > 0 && rewardRaw < 50000){
    rewardWcoin = Math.round(rewardRaw * 5);
  }
  const maxUsers = meta.maxUsers != null ? Number(meta.maxUsers) : (task.maxCompletions != null ? Number(task.maxCompletions) : null);
  const maxPerUser = meta.maxPerUser != null ? Number(meta.maxPerUser) : null;
  let reopenAt = meta.reopenAt || null;
  if(!reopenAt && task.description){
    const rm = String(task.description).match(/reopen:([0-9T:\-\.Z]+)/);
    if(rm) reopenAt = rm[1];
  }
  return {
    id,
    title: task.title || "WatchFlix activity",
    description: stripWfPackConfig(task.description || ""),
    active: task.active !== false && String(task.status || "active").toLowerCase() !== "inactive",
    rewardWcoin: rewardWcoin,
    durationSec: Number(meta.durationSec || task.durationSec || task.timerSec || 12) || 12,
    dailyLimit: Number(meta.dailyLimit || task.dailyLimit || 10) || 10,
    maxUsers: (maxUsers && maxUsers > 0) ? maxUsers : null,
    maxPerUser: (maxPerUser && maxPerUser > 0) ? maxPerUser : null,
    completionCount: Number(task.completionCount || 0),
    reopenAt,
    slots
  };
}

function isWatchFlixTask(t){
  if(!t) return false;
  const m = t.metadata || t.meta || {};
  const emb = decodeWfPackConfig(t.description);
  if(emb && String(emb.kind || "").toLowerCase().includes("watchflix")) return true;
  if(emb && Array.isArray(emb.slots) && emb.slots.length) return true;
  if(String(m.kind || "").toLowerCase() === "watchflix_ads") return true;
  if(String(m.kind || "").toLowerCase().includes("watchflix")) return true;
  if(String(t.platform || "").toLowerCase() === "watchflix") return true;
  if(Array.isArray(t.slots) || Array.isArray(m.slots)) return true;
  if(String(t.description || "").toLowerCase().includes("watchflix multi-stage")) return true;
  if(String(t.description || "").includes("<!--WFJSON:")) return true;
  return false;
}

/** Latest submission for this user + task from history API */
function taskIdOf(sub){
  if(!sub) return "";
  const t = sub.task;
  if(t == null) return String(sub.taskId || sub.metadata?.task || "");
  if(typeof t === "string") return t;
  if(typeof t === "object") return String(t._id || t.id || "");
  return String(t);
}
function latestSubForTask(history, taskId){
  if(!taskId) return null;
  const rows = (history || []).filter(s => s && String(taskIdOf(s)) === String(taskId));
  if(!rows.length) return null;
  rows.sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));
  return rows[0] || null;
}

let campaign = null;
let slots = [];
let N = 1;
let userHistory = [];

const state = {
  sessionId: sid(),
  startedAt: new Date().toISOString(),
  index: 0,
  clicked: [],
  stageDone: [],
  stageStartedAt: [],
  stageFinishedAt: [],
  earlyReturns: 0,
  timer: null,
  left: 0,
  timerArmed: false,
  timerAccum: 0,
  timerNeed: 0,
  timerLastTick: 0,
  submitted: false,
  packStatus: null,
  dailyLimit: 10
};

function setStatusBanner(status, extra){
  const el = $("statusBanner");
  if(!el) return;
  el.className = "status-banner";
  if(!status){ el.style.display = "none"; el.textContent = ""; return; }
  el.classList.add(status);
  if(status === "pending"){
    el.textContent = "Submitted — waiting for admin review. This pack is locked until a decision.";
  } else if(status === "approved"){
    el.textContent = "Completed — admin approved your reward. This pack stays completed until the admin reactivates it.";
  } else if(status === "rejected"){
    el.textContent = "Rejected" + (extra ? ": " + extra : "") + ". You can complete the stages again and resubmit.";
  }
}

function renderClicks(){
  $("clicks").innerHTML = Array.from({ length: N }, (_, j) => {
    const done = state.stageDone[j] || state.clicked[j];
    const cls = done ? "ok" : (j > state.index ? "lock" : "");
    return `<i id="c${j}" class="${cls}">${j + 1}</i>`;
  }).join("");
}

function packLocked(){
  return state.packStatus === "pending" || state.packStatus === "approved" || state.submitted;
}

function renderStep(){
  if(!campaign){
    $("title").textContent = "Unavailable";
    $("desc").textContent = "No active activity found. Ask admin to publish a WatchFlix pack.";
    $("cta").disabled = true;
    $("cta").textContent = "Unavailable";
    $("visual").innerHTML = `<div class="ph">No activity</div>`;
    return;
  }
  if(campaign.active === false && state.packStatus !== "approved"){
    $("title").textContent = "Paused";
    $("desc").textContent = "This pack is offline right now.";
    $("cta").disabled = true;
    $("cta").className = "cta locked";
    $("cta").textContent = "Offline";
    return;
  }

  // Pack-level lock after submit / approval
  if(state.packStatus === "approved"){
    $("title").textContent = "Completed";
    $("desc").textContent = "Admin approved this activity. It stays completed until the admin reactivates the pack.";
    $("cta").disabled = true;
    $("cta").className = "cta done locked";
    $("cta").textContent = "Completed ✓";
    $("completeBtn").style.display = "none";
    $("timer").textContent = "Done";
    $("bar").style.width = "100%";
    $("foot").textContent = "Reward credited after approval · +" + (campaign.rewardWcoin || 0) + " WCoin";
    state.stageDone = Array(N).fill(true);
    state.clicked = Array(N).fill(true);
    renderClicks();
    $("dots").innerHTML = Array.from({ length: N }, () => `<span class="done"></span>`).join("");
    $("visual").innerHTML = `<div class="ph">Completed</div>`;
    return;
  }

  if(state.packStatus === "pending" || state.submitted){
    $("title").textContent = "Under review";
    $("desc").textContent = "You already submitted this pack. Stages stay locked until admin approves or rejects.";
    $("cta").disabled = true;
    $("cta").className = "cta locked";
    $("cta").textContent = "Submitted";
    $("completeBtn").style.display = "none";
    $("timer").textContent = "Pending";
    $("foot").textContent = "Waiting for admin · +" + (campaign.rewardWcoin || 0) + " WCoin if approved";
    state.stageDone = Array(N).fill(true);
    state.clicked = Array(N).fill(true);
    renderClicks();
    $("dots").innerHTML = Array.from({ length: N }, () => `<span class="done"></span>`).join("");
    $("visual").innerHTML = `<div class="ph">Pending review</div>`;
    return;
  }

  const i = state.index;
  const slot = slots[i] || {};
  $("title").textContent = slot.title || ("Stage " + (i + 1));
  $("desc").textContent = slot.description || "Open this partner link, then wait for the timer.";
  $("step").textContent = "Step " + (i + 1) + " / " + N;
  $("dots").innerHTML = Array.from({ length: N }, (_, d) => {
    let cls = "";
    if(state.stageDone[d]) cls = "done";
    else if(d === i) cls = "on";
    return `<span class="${cls}"></span>`;
  }).join("");

  if(slot.imageUrl){
    const imgUrl = normalizeUrl(slot.imageUrl);
    $("visual").innerHTML = `<img src="${String(imgUrl).replace(/"/g, "")}" alt="" onerror="this.parentNode.innerHTML='<div class=ph>Offer ${i + 1}</div>'">`;
  } else {
    $("visual").innerHTML = `<div class="ph">Stage ${i + 1} / ${N}</div>`;
  }
  renderClicks();

  const cta = $("cta");
  const stageUrlValid = isValidUrl(normalizeUrl(slot.url || ""));

  // Finished stage → permanently disabled for this attempt
  if(state.stageDone[i]){
    cta.textContent = "Stage complete ✓";
    cta.className = "cta done";
    cta.disabled = true;
  } else if(state.clicked[i] && state.timerArmed){
    cta.textContent = "Timer running…";
    cta.className = "cta done";
    cta.disabled = true;
  } else if(state.clicked[i]){
    cta.textContent = "Opened ✓";
    cta.className = "cta done";
    cta.disabled = true;
  } else if(!stageUrlValid){
    cta.textContent = "Link unavailable";
    cta.className = "cta locked";
    cta.disabled = true;
  } else {
    cta.textContent = slot.cta || "Go!";
    cta.className = "cta";
    cta.disabled = false;
  }

  if(!state.timerArmed && !state.stageDone[i]){
    $("timer").textContent = state.clicked[i] ? "Done" : "Tap Go to start";
    if(!state.clicked[i]) $("bar").style.width = "0%";
  }
  let limTxt = "";
  if(campaign.maxPerUser) limTxt += " · " + campaign.maxPerUser + "× per user";
  if(campaign.maxUsers) limTxt += " · max " + campaign.maxUsers + " users";
  $("foot").textContent = "Reward after approval: +" + (campaign.rewardWcoin || 0) + " WCoin" + limTxt;
  updateCompleteBtn();
}

function updateCompleteBtn(){
  const btn = $("completeBtn");
  if(!btn) return;
  if(packLocked()){ btn.style.display = "none"; return; }
  const all = state.stageDone.length === N && state.stageDone.every(Boolean) && !state.timerArmed;
  btn.style.display = all && !state.submitted ? "flex" : "none";
  btn.disabled = !all;
}

function clearTimer(){
  if(state.timer) clearInterval(state.timer);
  state.timer = null;
  state.timerArmed = false;
}

function finishCurrentStage(){
  const i = state.index;
  state.stageDone[i] = true;
  state.clicked[i] = true;
  state.stageFinishedAt[i] = new Date().toISOString();
  if(campaign) saveStageProgress(campaign.id, state.clicked, state.index);
  clearTimer();
  $("bar").style.width = "100%";
  $("timer").textContent = "Done";
  if(state.index < N - 1){
    state.index += 1;
    showMsg("Stage " + (i + 1) + " locked. Continue to the next stage.", "info");
    renderStep();
  } else {
    showMsg("All stages complete. Tap Submit for review.", "info");
    renderStep();
  }
}

function startTimer(){
  clearTimer();
  const sec = Number(campaign.durationSec) || 12;
  state.timerArmed = true;
  state.timerNeed = sec;
  state.timerAccum = 0;
  state.timerLastTick = Date.now();
  state.left = sec;
  const i = state.index;
  if(!state.stageStartedAt[i]) state.stageStartedAt[i] = new Date().toISOString();
  $("timer").textContent = "00:" + String(Math.ceil(state.left)).padStart(2, "0");
  $("bar").style.width = "0%";
  const cta = $("cta");
  cta.disabled = true;
  cta.textContent = "Stay on this page…";
  cta.className = "cta done";
  showMsg("Keep this page open until the timer ends. Leaving early pauses the timer.", "info");
  state.timer = setInterval(() => {
    // Only count time while this tab is visible
    if(document.visibilityState === "hidden"){
      state.timerLastTick = Date.now();
      $("timer").textContent = "Paused — return here";
      return;
    }
    const now = Date.now();
    const delta = (now - state.timerLastTick) / 1000;
    state.timerLastTick = now;
    // Cap single tick so background throttling does not jump
    state.timerAccum += Math.min(delta, 0.5);
    const elapsed = state.timerAccum;
    state.left = Math.max(0, state.timerNeed - elapsed);
    $("timer").textContent = "00:" + String(Math.ceil(state.left)).padStart(2, "0");
    $("bar").style.width = Math.min(100, (elapsed / state.timerNeed) * 100) + "%";
    if(state.left <= 0){
      finishCurrentStage();
    }
  }, 100);
}

document.addEventListener("visibilitychange", () => {
  if(!state.timerArmed) return;
  if(document.visibilityState === "hidden"){
    state.earlyReturns = (state.earlyReturns || 0) + 1;
    $("timer").textContent = "Paused — return here";
    showMsg("You left early. Timer paused — stay on this page to finish the stage.", "err");
  } else {
    state.timerLastTick = Date.now();
    showMsg("Welcome back. Timer continues — stay until it ends.", "info");
  }
});

function onGo(){
  if(!campaign || packLocked()) return;
  if(state.timerArmed) return;
  const i = state.index;
  if(state.stageDone[i]){
    showMsg("This stage is already complete and locked.", "info");
    return;
  }
  const slot = slots[i] || {};
  let url = normalizeUrl(slot.url || "");
  if(!url || !isValidUrl(url)){
    showMsg("This stage link is broken. Contact support.", "err");
    return;
  }
  state.clicked[i] = true;
  if(campaign) saveStageProgress(campaign.id, state.clicked, state.index);
  renderClicks();
  try{ window.open(url, "_blank", "noopener,noreferrer"); }catch(e){ location.href = url; }
  startTimer();
  showMsg("Stage started. Wait for the timer — this stage will lock when done.", "info");
}

async function loadHistory(){
  try{
    const res = await fetch(API_URL + "/api/v1/sponsored-tasks/history", {
      method: "GET",
      headers: authHeaders(false)
    });
    const body = await res.json().catch(() => ({}));
    if(!res.ok) return [];
    const list = Array.isArray(body.data) ? body.data
      : (Array.isArray(body.history) ? body.history
      : (Array.isArray(body) ? body : []));
    return list.filter(Boolean);
  }catch(e){ return []; }
}

async function loadCampaign(){
  const t = token();
  if(!t && !uid()){
    showMsg("Open this from your dashboard while signed in.", "err");
    $("cta").textContent = "Sign in required";
    $("cta").disabled = true;
    return;
  }
  if(!t){
    showMsg("Session missing. Return to dashboard and sign in again.", "err");
    $("cta").disabled = true;
    return;
  }
  try{
    const [res, history] = await Promise.all([
      fetch(API_URL + "/api/v1/sponsored-tasks", { method: "GET", headers: authHeaders(false) }),
      loadHistory()
    ]);
    userHistory = history;
    const body = await res.json().catch(() => ({}));
    if(res.status === 401){
      showMsg("Session expired. Sign in again from the dashboard.", "err");
      $("cta").disabled = true;
      return;
    }
    if(!res.ok || body.success === false){
      throw new Error(body.message || body.error || ("HTTP " + res.status));
    }
    const rows = Array.isArray(body.data) ? body.data : (Array.isArray(body) ? body : []);
    const active = rows.filter(t => t && t.active !== false);
    const wfRows = active.filter(t => isWatchFlixTask(t));
    const wantedId = qs("id");
    let task = null;
    if(wantedId){
      task = wfRows.find(t => t && String(t._id || t.id || "") === String(wantedId))
        || active.find(t => t && String(t._id || t.id || "") === String(wantedId))
        || rows.find(t => t && String(t._id || t.id || "") === String(wantedId))
        || null;
    }
    if(!task){
      // Only WatchFlix packs — never a random Sponsored task
      task = wfRows[0] || null;
    }
    // Fetch full task (metadata/slots/reopenAt often missing on list endpoint)
    if(task && (task._id || task.id)){
      try{
        const det = await fetch(API_URL + "/api/v1/sponsored-tasks/" + encodeURIComponent(task._id || task.id), {
          method: "GET", headers: authHeaders(false)
        });
        const detBody = await det.json().catch(() => ({}));
        const full = detBody.data || detBody.task || detBody;
        if(full && (full._id || full.id)) task = Object.assign({}, task, full);
      }catch(e){}
    }
    campaign = mapTaskToCampaign(task);
    if(!campaign){
      $("title").textContent = "No campaigns";
      $("desc").textContent = "Admin has not published an active WatchFlix pack yet.";
      $("cta").disabled = true;
      $("cta").textContent = "None available";
      $("visual").innerHTML = `<div class="ph">Empty</div>`;
      $("foot").textContent = "Check back after admin publishes a pack.";
      return;
    }

    slots = campaign.slots || [];
    N = Math.max(1, slots.length);
    state.clicked = Array(N).fill(false);
    state.stageDone = Array(N).fill(false);
    state.stageStartedAt = Array(N).fill(null);
    state.stageFinishedAt = Array(N).fill(null);
    state.earlyReturns = 0;
    state.dailyLimit = 99;
    state.index = 0;
    state.submitted = false;
    state.packStatus = null;

    // Admin review status for this user + pack
    const sub = latestSubForTask(userHistory, campaign.id);
    if(sub){
      const st = String(sub.status || "").toLowerCase();
      if(st === "approved"){
        const reopenAt = campaign.reopenAt || (task.metadata || task.meta || {}).reopenAt;
        const subAt = new Date(sub.updatedAt || sub.createdAt || 0).getTime();
        const reopenTs = reopenAt ? new Date(reopenAt).getTime() : 0;
        if(reopenTs && reopenTs > subAt){
          state.packStatus = null;
          clearStageProgress(campaign.id);
          setStatusBanner(null);
          showMsg("Pack reopened by admin — complete stages again.", "info");
        } else {
          state.packStatus = "approved";
          setStatusBanner("approved");
        }
      } else if(st === "pending"){
        state.packStatus = "pending";
        state.submitted = true;
        setStatusBanner("pending");
      } else if(st === "rejected"){
        // Rejected → allow full retry; clear local stage progress
        state.packStatus = null;
        clearStageProgress(campaign.id);
        setStatusBanner("rejected", (sub && (sub.rejectionReason || sub.reason)) || "");
        showMsg("Previous attempt was rejected. Complete all stages again.", "err");
      }
    } else {
      setStatusBanner(null);
      // Restore in-progress stages (not submitted yet)
      const prog = loadStageProgress(campaign.id);
      if(prog && Array.isArray(prog.clicked) && prog.clicked.length === N){
        state.clicked = prog.clicked.map(Boolean);
        // Treat previously clicked stages that user left mid-pack as done only if they advanced past them
        state.stageDone = state.clicked.map((c, idx) => {
          // If a later stage was started, earlier ones are done
          if(c && prog.index > idx) return true;
          return false;
        });
        // Find first incomplete stage
        let idx = state.stageDone.findIndex(d => !d);
        if(idx < 0) idx = N - 1;
        state.index = idx;
      }
    }

    renderStep();
  }catch(e){
    showMsg(e.message || "Could not load campaigns from server", "err");
    $("cta").disabled = true;
    $("cta").textContent = "Load failed";
    $("visual").innerHTML = `<div class="ph">Error</div>`;
  }
}

async function submitForReview(){
  if(state.submitted || state.packStatus === "approved" || state.packStatus === "pending") return;
  if(!campaign){
    showMsg("No campaign loaded.", "err");
    return;
  }
  if(!state.stageDone.every(Boolean)){
    showMsg("Complete every stage first (each locks when the timer ends).", "err");
    return;
  }
  if(state.timerArmed){
    showMsg("Wait for the timer to finish.", "err");
    return;
  }
  const u = uid();
  if(!u){
    showMsg("Sign in from the dashboard first.", "err");
    return;
  }
  if(!token()){
    showMsg("Session missing. Sign in again.", "err");
    return;
  }
  // Times per user (from pack config — empty/null = unlimited)
  const maxPer = Number(campaign.maxPerUser) || 0;
  if(maxPer > 0){
    const mine = (userHistory || []).filter(s => {
      const tid = taskIdOf(s);
      if(String(tid) !== String(campaign.id)) return false;
      const st = String(s.status || "").toLowerCase();
      // count pending + approved (rejected does not consume a slot if you want retry — count all attempts)
      return st === "pending" || st === "approved" || st === "completed" || !st;
    }).length;
    if(mine >= maxPer){
      showMsg("Limit reached: you can complete this pack " + maxPer + " time(s). You have used " + mine + ".", "err");
      return;
    }
  }
  // Max users total (empty = unlimited)
  const maxUsers = Number(campaign.maxUsers) || 0;
  if(maxUsers > 0 && Number(campaign.completionCount || 0) >= maxUsers){
    showMsg("This pack is full (max " + maxUsers + " users).", "err");
    return;
  }
  if(state.timerArmed || (state.left > 0 && state.timerArmed)){
    showMsg("Wait for the timer to finish on this page before submitting.", "err");
    return;
  }

  const btn = $("completeBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Submitting…"; }

  const proofUrl = "https://watchflix-app.pages.dev/watchflixads/?id=" + encodeURIComponent(campaign.id) + "&session=" + encodeURIComponent(state.sessionId);
  const meta = {
      kind: "watchflix_ads",
      session: state.sessionId,
      user: u,
      username: uname(),
      task: campaign.id,
      taskTitle: campaign.title || "WatchFlix Ads",
      rewardWcoin: Number(campaign.rewardWcoin) || 0,
      slots: N,
      clicks: state.clicked.slice(),
      stagesDone: state.stageDone.slice(),
      stageStartedAt: (state.stageStartedAt || []).slice(),
      stageFinishedAt: (state.stageFinishedAt || []).slice(),
      earlyReturns: state.earlyReturns || 0,
      startedAt: state.startedAt,
      completedAt: new Date().toISOString(),
      status: "pending"
  };
  const payload = {
    proofType: "url",
    proofUrl: proofUrl,
    proofImageUrl: proofUrl,
    metadata: meta
  };

  try{
    let res = await fetch(API_URL + "/api/v1/sponsored-tasks/" + encodeURIComponent(campaign.id) + "/submit", {
      method: "POST",
      headers: authHeaders(true),
      body: JSON.stringify(payload)
    });
    let body = await res.json().catch(() => ({}));
    // Fallback: multipart text fields if JSON rejected
    if(!res.ok || body.success === false){
      const form = new FormData();
      form.append("proofType", "url");
      form.append("proofUrl", proofUrl);
      form.append("metadata", JSON.stringify(meta));
      res = await fetch(API_URL + "/api/v1/sponsored-tasks/" + encodeURIComponent(campaign.id) + "/submit", {
        method: "POST",
        headers: { "X-API-Key": API_KEY, "Authorization": "Bearer " + token() },
        body: form
      });
      body = await res.json().catch(() => ({}));
    }
    if(res.status === 401){
      showMsg("Session expired. Sign in again.", "err");
      if(btn){ btn.disabled = false; btn.textContent = "Submit for review"; }
      return;
    }
    if(!res.ok || body.success === false){
      throw new Error(body.message || body.error || ("HTTP " + res.status));
    }

    const comp = getCompletionsToday();
    comp.push({ campaignId: campaign.id, at: new Date().toISOString(), session: state.sessionId });
    try{ localStorage.setItem(completionsKey(), JSON.stringify(comp)); }catch(e){}
    clearStageProgress(campaign.id);

    state.submitted = true;
    state.packStatus = "pending";
    setStatusBanner("pending");
    $("completeBtn").style.display = "none";
    showMsg("Submitted for review. Pack locked until admin decides · +" + (campaign.rewardWcoin || 0) + " WCoin", "ok");
    renderStep();
  }catch(e){
    showMsg(e.message || "Submit failed", "err");
    if(btn){ btn.disabled = false; btn.textContent = "Submit for review"; }
  }
}

loadCampaign();
</script>
